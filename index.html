<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero To Hero Smart School</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 0; color: #1e293b; }
    header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; text-align: center; padding: 25px 15px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    header img { width: 75px; height: 75px; border-radius: 50%; background: white; padding: 4px; margin-bottom: 10px; }
    header h1 { margin: 5px 0; font-size: 22px; }
    header p { margin: 0; font-size: 14px; opacity: 0.9; }
    .container { padding: 15px; max-width: 450px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.06); margin-bottom: 18px; }
    h3 { margin-top: 0; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 18px; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button:hover { background: #1d4ed8; }
    .green-btn { background: #10b981; }
    .logout-btn { background: #ef4444; }
    .toggle-btn { background: #f1f5f9; color: #1e3a8a; border: 1px solid #cbd5e1; margin-top: 5px; }
    .msg { text-align: center; font-size: 14px; font-weight: bold; margin-top: 10px; }
    .hidden { display: none; }
    .info-row { padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; font-size: 15px; }
    .admin-footer { text-align: center; padding: 15px 0 30px; }
    .admin-link { display: inline-block; background: #1e293b; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

  <header>
    <img src="assets/logo.png" alt="School Logo" onerror="this.style.display='none'">
    <h1>Zero To Hero Smart School</h1>
    <p>Play Group to Class 8th & Coaching Classes</p>
  </header>

  <div class="container">

    <!-- 1. STUDENT LOGIN CARD -->
    <div id="studentLoginBox" class="card">
      <h3>🎓 Student Login (छात्र लॉगिन)</h3>
      <form id="studentLoginForm">
        <input type="tel" id="stPhone" placeholder="Mobile Number / Login ID" required>
        <input type="password" id="stPass" placeholder="Password (एडमिन द्वारा दिया गया)" required>
        <button type="submit" id="stLoginBtn">Login करें</button>
      </form>
      <p id="stError" class="msg" style="color:red;"></p>
      <p style="text-align:center; font-size:13px; color:#64748b; margin:10px 0 0;">
        * पासवर्ड भूल जाने पर कृपया स्कूल Admin से संपर्क करें।
      </p>
    </div>

    <!-- 2. STUDENT DASHBOARD (लॉगिन के बाद दिखेगा) -->
    <div id="studentDashboard" class="card hidden">
      <h3 id="welcomeName">स्वागत है</h3>
      <div class="info-row"><span>Class (कक्षा):</span> <strong id="stClass"></strong></div>
      <div class="info-row"><span>Father's Name:</span> <strong id="stFather"></strong></div>
      <div class="info-row"><span>Mobile / ID:</span> <strong id="stMobile"></strong></div>
      <div class="info-row"><span>Fees Status:</span> <strong id="stFees"></strong></div>
      <button class="logout-btn" onclick="logoutStudent()">Logout करें</button>
    </div>

    <!-- 3. ONLINE ADMISSION FORM CARD -->
    <div class="card">
      <h3>📝 Online Admission (नया प्रवेश आवेदन)</h3>
      <button type="button" class="toggle-btn" onclick="toggleAdmission()">प्रवेश फॉर्म खोलें / बंद करें</button>
      
      <form id="admissionForm" class="hidden" style="margin-top:10px;">
        <input type="text" id="admName" placeholder="छात्र का पूरा नाम (Student Name)" required>
        <select id="admClass" required>
          <option value="">कक्षा चुनें (Select Class)</option>
          <option value="Play Group">Play Group</option>
          <option value="Nursery">Nursery</option>
          <option value="LKG / UKG">LKG / UKG</option>
          <option value="Class 1 - 5">Class 1 - 5</option>
          <option value="Class 6 - 8">Class 6 - 8</option>
          <option value="Coaching">Coaching</option>
        </select>
        <input type="text" id="admFather" placeholder="पिता का नाम (Father's Name)" required>
        <input type="tel" id="admPhone" placeholder="मोबाइल नंबर (Contact Number)" required>
        <button type="submit" class="green-btn" id="admBtn">आवेदन जमा करें (Submit)</button>
      </form>
      <p id="admMsg" class="msg" style="color:green;"></p>
    </div>

    <!-- 4. ADMIN PANEL LINK -->
    <div class="admin-footer">
      <a href="admin-login.html" class="admin-link">🔐 Admin Login (एडमिन लॉगिन)</a>
    </div>

  </div>

  <script>
    function toggleAdmission() {
      document.getElementById('admissionForm').classList.toggle('hidden');
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc, query, where, getDocs } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyCtc5bzTqZD2V6TIO3aQF1n0sz8fSZIsTM",
      projectId: "zero-to-hero-smart-schoo-bf738",
      storageBucket: "zero-to-hero-smart-schoo-bf738.firebasestorage.app",
      messagingSenderId: "641666497738",
      appId: "1:641666497738:web:fc183a8814028607960833",
      measurementId: "G-3JQBXK8NRQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Student Login Logic
    document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phoneInput = document.getElementById('stPhone').value.trim();
      const passInput = document.getElementById('stPass').value.trim();
      const errBox = document.getElementById('stError');
      const btn = document.getElementById('stLoginBtn');

      btn.textContent = "जांच हो रही है...";
      errBox.textContent = "";

      try {
        const q = query(
          collection(db, "students"),
          where("phone", "==", phoneInput),
          where("password", "==", passInput)
        );
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          btn.textContent = "Login करें";
          errBox.textContent = "गलत मोबाइल नंबर या पासवर्ड! कृपया Admin से संपर्क करें।";
        } else {
          querySnapshot.forEach((doc) => {
            const student = doc.data();
            document.getElementById('welcomeName').textContent = "नमस्ते, " + student.name;
            document.getElementById('stClass').textContent = student.className;
            document.getElementById('stFather').textContent = student.fatherName;
            document.getElementById('stMobile').textContent = student.phone;
            document.getElementById('stFees').textContent = student.feeStatus;

            document.getElementById('studentLoginBox').classList.add('hidden');
            document.getElementById('studentDashboard').classList.remove('hidden');
          });
        }
      } catch (error) {
        btn.textContent = "Login करें";
        errBox.textContent = "Error: " + error.message;
      }
    });

    window.logoutStudent = () => {
      document.getElementById('studentDashboard').classList.add('hidden');
      document.getElementById('studentLoginBox').classList.remove('hidden');
      document.getElementById('studentLoginForm').reset();
      document.getElementById('stLoginBtn').textContent = "Login करें";
    };

    // 2. Online Admission Form Logic (Sends directly to Admin Dashboard)
    document.getElementById('admissionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const admBtn = document.getElementById('admBtn');
      const admMsg = document.getElementById('admMsg');
      admBtn.textContent = "भेजा जा रहा है...";

      try {
        await addDoc(collection(db, "students"), {
          name: document.getElementById('admName').value.trim(),
          className: document.getElementById('admClass').value,
          fatherName: document.getElementById('admFather').value.trim(),
          phone: document.getElementById('admPhone').value.trim(),
          password: "Pending (Admin सेट करेगा)",
          feeStatus: "New Admission"
        });
        e.target.reset();
        e.target.classList.add('hidden');
        admBtn.textContent = "आवेदन जमा करें (Submit)";
        admMsg.textContent = "✅ आपका प्रवेश आवेदन सफलतापूर्वक जमा हो गया है! जल्द ही स्कूल Admin आपसे संपर्क करेंगे।";
      } catch (error) {
        admBtn.textContent = "आवेदन जमा करें (Submit)";
        admMsg.style.color = "red";
        admMsg.textContent = "Error: " + error.message;
      }
    });
  </script>

</body>
</html>
